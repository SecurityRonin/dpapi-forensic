name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@619094ad54edc586f5c2733358e00326b30790bd
    with:
      # This repo had NO coverage job at all, so inheriting the fleet `strict`
      # per-line gate would invent a requirement CI never enforced. Measured
      # instead: `cargo llvm-cov --workspace --all-features --summary-only`
      # reports TOTAL line coverage 84.60% (1513 lines, 233 missed), so the
      # floor is floor(84.60) = 84 — the level the repo demonstrably holds
      # today, not a new bar. Migrating to `strict` is a deliberate, separate
      # change. Measured on macOS/arm64 with rustc 1.96.0; the Linux runner
      # may differ by a fraction of a point.
      coverage-gate: floor
      coverage-floor: 84
